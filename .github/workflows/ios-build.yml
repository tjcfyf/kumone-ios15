name: iOS Build

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: macos-15
    defaults:
      run:
        working-directory: kumone
    steps:
      - uses: actions/checkout@v4
        with:
          # SPM resolves path-based dependencies by directory name; the
          # package manifest refers to "kumone", so check out into that name.
          path: kumone

      - name: Toolchain info
        run: |
          sudo xcode-select -s /Applications/Xcode_26.3.app
          xcodebuild -version
          swift --version
          xcodebuild -showsdks | grep -i "iphoneos" || true

      - name: Build (unsigned)
        id: build
        run: |
          set -o pipefail
          xcodebuild build \
            -workspace ios/KumoneIOS.xcworkspace \
            -scheme KumoneIOS \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            2>&1 | tee build.log
          echo "exit=$?"

      - name: Summary
        if: always()
        run: |
          echo "=== errors: $(grep -c 'error:' build.log || echo 0) ==="
          grep "error:" build.log | sed "s|$GITHUB_WORKSPACE/||g" | sort -u | head -300 || true
          echo "=== result ==="
          grep -E "BUILD (SUCCEEDED|FAILED)" build.log | tail -3 || echo "no result line"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-log
          path: kumone/build.log
